# multiflexi.eu default Apache configuration

Alias /hub /usr/share/multiflexi-eu

# Canonical JSON Schema files shipped by php-vitexsoftware-multiflexi-core.
# Alias each file (not the whole /usr/lib/multiflexi tree) so UI PHP classes
# installed under that directory are not published.
Alias /schema/application.json /usr/lib/multiflexi/application.json
Alias /schema/credential-type.json /usr/lib/multiflexi/credential-type.json
Alias /schema/credential-prototype.json /usr/lib/multiflexi/credential-prototype.json
Alias /schema/report.json /usr/lib/multiflexi/report.json

<Directory /usr/lib/multiflexi>
	<Files "*.json">
		Require all granted
		<IfModule mod_headers.c>
			Header set Access-Control-Allow-Origin "*"
		</IfModule>
	</Files>
</Directory>

# Legacy filenames used in older docs and tests
Redirect 301 /multiflexi.app.schema.json /schema/application.json
Redirect 301 /multiflexi.credential-type.schema.json /schema/credential-type.json
Redirect 301 /multiflexi.report.schema.json /schema/report.json
Redirect 301 /schema/multiflexi.app.schema.json /schema/application.json
Redirect 301 /schema/credential-prototype.schema.json /schema/credential-prototype.json

<Directory /usr/share/multiflexi-eu>
	Options FollowSymLinks
	DirectoryIndex index.php

	<IfModule mod_php.c>
		AddType application/x-httpd-php .php
                <FilesMatch ".+\.php$">
                    SetHandler application/x-httpd-php
                </FilesMatch>

		php_admin_flag allow_url_fopen On
		php_admin_value open_basedir /usr/share/multiflexi-eu/:/usr/lib/multiflexi-eu/:/etc/multiflexi-eu/:/usr/share/php/:/usr/share/javascript/:/usr/share/locale/:/usr/share/multiflexi-executor/:/usr/lib/multiflexi-executor/:/usr/share/multiflexi-web/images/:/usr/share/multiflexi/images/:/var/tmp:/tmp:/var/lib/dbconfig-common/sqlite3/multiflexi-eu/
	</IfModule>

# enable gzip compression
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/x-javascript text/javascript application/javascript application/json
</IfModule>

</Directory>
