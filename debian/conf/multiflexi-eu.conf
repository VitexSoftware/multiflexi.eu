# multiflexi.eu default Apache configuration

Alias /hub /usr/share/multiflexi-eu

<Directory /usr/share/multiflexi-eu>
	Options FollowSymLinks
	DirectoryIndex index.php

	<IfModule mod_php.c>
		AddType application/x-httpd-php .php
                <FilesMatch ".+\.php$">
                    SetHandler application/x-httpd-php
                </FilesMatch>

		php_admin_flag allow_url_fopen On
		php_admin_value open_basedir /usr/share/multiflexi-eu/:/usr/lib/multiflexi-eu/:/etc/multiflexi-eu/:/usr/share/php/:/usr/share/javascript/:/usr/share/locale/:/var/tmp:/tmp:/var/lib/dbconfig-common/sqlite3/multiflexi-eu/
	</IfModule>

# enable gzip compression
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/x-javascript text/javascript application/javascript application/json
</IfModule>

</Directory>
